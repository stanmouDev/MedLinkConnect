services:
  - type: web
    name: medlink-connect-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && gunicorn medlink_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: medlink-connect-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: medlink-connect-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-efuej71cc-ifesorchukwufelix-1426.vercel.app,https://frontend-nine-orcin-53.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: medlink-connect-db
    plan: free
    databaseName: medlink_connect
    user: medlink_connect
